name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Planner regression tests
        run: make test PY=python
      - name: Numbers and Tables I-II regenerate from the recorded data
        run: make verify PY=python
